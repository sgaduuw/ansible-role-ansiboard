---
name: CI
on:
  # CI is the pull-request gate: lint + the molecule distro matrix on
  # every PR. It runs on NO branch or tag push. The Galaxy re-import
  # lives in release.yml on tag push (it trusts this gate and does not
  # re-run molecule). The weekly schedule is a distro-drift health
  # check, independent of releases. (develop is a loose integration
  # branch; master is the PR-gated release branch.)
  pull_request:
    branches: [develop, master, "release/*", "hotfix/*"]
  schedule:
    - cron: "30 5 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: yamllint .
      - run: ansible-lint

  molecule:
    needs: lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        distro:
          - rockylinux9
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404
          - fedora42
          - fedora43
          - amazonlinux2023
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Set up role symlink
        run: |
          mkdir -p ~/.ansible/roles
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/ansiboard
      - name: Configure Docker for cgroups v2
        run: |
          echo '{"default-cgroupns-mode": "host"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
